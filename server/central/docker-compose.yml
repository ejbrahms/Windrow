# The central Postgres of docs/design/global-identity-and-central-db.md §2.5 — "PostgreSQL 16,
# usage_events range-partitioned by month". One container, no orchestration, because phase 3 is
# reversible by configuration (§2.7) and a deployment that is hard to take down is not.
#
#   docker compose -f server/central/docker-compose.yml up -d
#   WINDROW_CENTRAL_DB_URL=postgres://windrow:windrow@localhost:5432/windrow_central \
#     npm run central --prefix server
#
# The schema is NOT in this file and there is no init script. ../schema/migrator.js owns it, driven
# by ./centralMigrations.js at boot, for the reason §2.5 gives: N nodes at mixed versions make
# ad-hoc DDL untenable, and a compose-time `init.sql` would be a second place the schema is
# written down, free to disagree with the ledger about what version this database is at.

# > [!caution]
# > NEVER bring `central` up from this file ALONE on a host that also runs a node. The base file
# > gives the container a PRIVATE, EMPTY CA directory in a named volume, so central mints a brand
# > new root on first boot — which orphans every enrolled node in the fleet at once. Compose it
# > with ./docker-compose.host-ca.yml, which bind-mounts the host's real CA read-only:
# >
# >   npm run central:up        (both files — this is the one to use)
# >   npm run central:pull      (fetch the published image from ghcr.io — the default path)
# >   npm run central:build     (rebuild the image locally, bundle included — for local changes)
# >   npm run central:db        (postgres ONLY — names the service, so central is untouched)
# >
# > `central:db` names its service for exactly this reason. `docker compose … up -d` with no
# > service argument starts EVERYTHING here, and that is the mistake this note exists to prevent.

services:
  postgres:
    image: postgres:16-alpine
    container_name: windrow-central-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-windrow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-windrow}
      POSTGRES_DB: ${POSTGRES_DB:-windrow_central}
      # Timestamps are stored as timestamptz and every boundary this code writes is UTC
      # (../central/partitions.js) — pinning the server too means a psql session an operator opens
      # by hand reads the same month boundaries the partitions were cut on.
      TZ: UTC
      PGTZ: UTC
    ports:
      # Loopback ONLY. Postgres holds every usage row and, in active mode, the canonical policy —
      # so its port is not something to publish on all interfaces. The access control is a
      # password (below), but the first line of defence is that nothing off this host can even
      # reach the port. central talks to it over the compose network, not this published port
      # (see the central service's WINDROW_CENTRAL_DB_URL), so this exists only for a host-run
      # `npm run central` and for psql by hand — both loopback. Do not change the left side to
      # 0.0.0.0 without a reason and a firewall.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - windrow-central-data:/var/lib/postgresql/data
    healthcheck:
      # The app waits on nothing and retries nothing at boot — it opens a pool, and `pg` fails fast
      # by design (see ../central/pgDriver.js's connectionTimeoutMillis). So the healthcheck is what
      # `depends_on: condition: service_healthy` reads, for anything composed on top of this.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-windrow} -d ${POSTGRES_DB:-windrow_central}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The central process itself. Optional: `docker compose up -d postgres` still gives you just the
  # database for a host-run `npm run central`, which is what the header above documents.
  #
  #   docker compose -f server/central/docker-compose.yml up -d --build central
  #
  # WHY THIS EXISTS. The healthcheck above says it is there for "anything composed on top of this",
  # and this is that thing. It also closes a real failure: central has no SQLite fallback, so a
  # central started before Postgres dies with ECONNREFUSED during migration, and under the Windows
  # service the node-windows wrapper burns its `maxrestarts 3` and gives up silently. That happened
  # on 2026-08-20. `depends_on: condition: service_healthy` is the ordering guarantee whose absence
  # caused it.
  central:
    # The published image — .github/workflows/publish-central.yml pushes it from every commit to
    # main, and this line is the single place its name is written down. `image:` and `build:`
    # together give the two install paths one service definition: `npm run central:pull` fetches
    # this tag from the registry (a quick start needs no client toolchain and no image build), and
    # `npm run central:build` builds locally and tags the result with this same name, shadowing
    # whatever was pulled. Compose only builds when the tag is absent locally, so whichever you ran
    # last is what `central:up` starts. Pin a version by setting WINDROW_CENTRAL_IMAGE
    # (e.g. ghcr.io/ejbrahms/windrow-central:1.0.0) — :latest tracks main.
    image: ${WINDROW_CENTRAL_IMAGE:-ghcr.io/ejbrahms/windrow-central:latest}
    build:
      # The repo ROOT, not this directory — central requires ../config, ../schema, ../enrollment
      # and ../principals, so the whole server/ tree has to be in the context.
      context: ../..
      dockerfile: server/central/Dockerfile
    container_name: windrow-central
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # `postgres` is the compose service name, not localhost: inside the network the database is
      # not on this container's loopback. This is the one setting that always differs from the host
      # install's windrow.env.
      WINDROW_CENTRAL_DB_URL: postgres://${POSTGRES_USER:-windrow}:${POSTGRES_PASSWORD:-windrow}@postgres:5432/${POSTGRES_DB:-windrow_central}
      WINDROW_CENTRAL_TLS_PORT: "5443"
      WINDROW_CENTRAL_PORT: "5000"
      # Container-local only. central/index.js binds the plaintext listener to 127.0.0.1, which in
      # here is this container's own loopback — nothing outside can reach it, and no `ports:` entry
      # could publish it. It exists so HEALTHCHECK can ask /health without a client certificate.
      WINDROW_CENTRAL_ALLOW_INSECURE: "1"
      # The browser's door. central/dashboardProxy.js listens here and forwards to the plaintext
      # listener above over this container's loopback — which is what lets a browser reach the
      # dashboard with no client certificate, the thing :5443 cannot offer. Published below to the
      # host's 127.0.0.1 ONLY, because anything that reaches it has full admin (see the proxy's
      # header). Set to empty to turn the door off and go back to mTLS-only.
      WINDROW_CENTRAL_DASHBOARD_PORT: "5599"
      # THE SETTING TO GET RIGHT. The TLS certificate is minted for CN=localhost with a `localhost`
      # SAN (server/enrollment/ca.js), and a node dialling `windrow-central:5443` or the host's LAN
      # name will fail verification against it. Add every name nodes will actually dial. Changing
      # this after first boot needs the old server-cert.pem deleted from the volume — ca.js loads an
      # existing cert rather than reissuing it.
      WINDROW_SERVER_SANS: ${WINDROW_SERVER_SANS:-windrow-central,host.docker.internal}
      TZ: UTC
    ports:
      # mTLS only. The client certificate is the access control, so binding all interfaces is
      # correct here in a way it would not be for the node's :4000.
      - "${CENTRAL_TLS_PORT:-5443}:5443"
      # The dashboard proxy. Bound to the host's 127.0.0.1 DELIBERATELY and not negotiably: there is
      # no certificate check behind this port, so its reachability IS its access control. On a
      # single-operator host that is the operator alone. Do not change the left side to 0.0.0.0
      # without putting real authentication in front of it first.
      - "127.0.0.1:${CENTRAL_DASHBOARD_PORT:-5599}:5599"
    volumes:
      # The enrollment CA and the bootstrap token. See the Dockerfile — this CA signs every node
      # certificate in the fleet, so this volume is the one piece of state here that cannot be
      # rebuilt from Postgres.
      - windrow-central-ca:/app/server/data

volumes:
  windrow-central-data:
  windrow-central-ca:
